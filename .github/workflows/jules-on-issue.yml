name: Jules on Issue
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    if: |
      github.event.label.name == 'jules' &&
      contains(fromJSON('["joaomagdaleno"]'), github.event.issue.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: google-labs-code/jules-invoke@v1
        with:
          prompt: |
            Resolve GitHub issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Read AGENTS.md and .jules/state.md first. Follow all dependency rules.
            The repo has 186 passing tests that must not regress.
            Open a PR when done with label `auto-merged` if AGENTS.md §6 conditions are met.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: main

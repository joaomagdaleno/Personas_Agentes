name: Auto-merge agent PRs
on:
  pull_request:
    types: [labeled, synchronize]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: contains(github.event.pull_request.labels.*.name, 'auto-merged')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
      - name: Install and test
        run: |
          bun install
          bun test
      - name: Auto-merge
        if: success()
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "auto-merged"
          MERGE_METHOD: "squash"
          MERGE_REMOVE_LABELS: "auto-merged"
          MERGE_RETRIES: "3"
          MERGE_RETRY_SLEEP: "30000"

name: "Auto-merge agent PRs (delegates validation to ci.yml)"

# ─────────────────────────────────────────────────────────────────────────────
# Design note (why this workflow no longer runs `bun test` itself)
#
# The PSA test suite requires a fully populated `bin/` directory (64 native
# artifacts: llama.cpp DLLs, hub.exe, analyzer.exe, TLS certs). `bin/` is
# gitignored, so it does NOT exist on any clean CI runner, and nothing in the
# repo can rebuild the full set (scripts/ensure_binaries.ts only builds the
# Rust analyzer and the Go hub; native-build.yml only produces analyzer and
# scanner).
#
# Running `bun test` on a runner without that environment made every agent PR
# fail -> false escalation -> the human merged manually anyway. Validation is
# therefore delegated to `ci.yml` (windows-latest), and this workflow only
# enables GitHub's native auto-merge, which waits for those required checks.
#
# This workflow intentionally NEVER checks out the PR branch: all inspection
# happens through the GitHub API, so untrusted PR code is never executed.
#
# PREREQUISITE: branch protection on `main` must require the `ci.yml` status
# check. Without it, GitHub has no required check to wait for and auto-merge
# will merge immediately (or the API call will be rejected).
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Runs every 2 hours to quickly process agent PRs
    - cron: '0 */2 * * *'
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    # Do not run on fork PRs for security
    if: github.repository == 'joaomagdaleno/Personas_Agentes' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository (for .jules state files only)"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: "Validate workflow YAML structure"
        run: |
          bun -e "
            const fs = require('fs');
            const file = '.github/workflows/auto-merge-agent-prs.yml';
            const content = fs.readFileSync(file, 'utf8');
            if (!content || content.trim().length === 0) {
              console.error('YAML file is empty');
              process.exit(1);
            }
            console.log('YAML file structure validated successfully.');
          " || true

      - name: "Clear stale file locks (>24h)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun -e "
            const fs = require('fs');
            const statePath = '.jules/state.md';
            if (!fs.existsSync(statePath)) process.exit(0);

            let content = fs.readFileSync(statePath, 'utf8');
            const now = Date.now();
            const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;
            const clearedLocks = [];

            const lines = content.split('\n');
            let inLockTable = false;
            const updatedLines = [];

            for (let line of lines) {
              if (/^##\s+File locks/i.test(line)) {
                inLockTable = true;
                updatedLines.push(line);
                continue;
              }
              if (inLockTable && /^##\s+/.test(line)) {
                inLockTable = false;
              }
              if (inLockTable && line.trim().startsWith('|')) {
                const cells = line.split('|').map((c) => c.trim());
                // | File | Locked by | Since | Reason |
                if (cells.length >= 5 && cells[3] && /^\d{4}-\d{2}-\d{2}/.test(cells[3])) {
                  const lockTime = Date.parse(cells[3]);
                  if (!isNaN(lockTime) && now - lockTime > TWENTY_FOUR_HOURS) {
                    clearedLocks.push(cells[1]);
                    continue; // drop stale lock row
                  }
                }
              }
              updatedLines.push(line);
            }

            if (clearedLocks.length > 0) {
              fs.writeFileSync(statePath, updatedLines.join('\n'));
              console.log('Cleared stale locks: ' + clearedLocks.join(', '));
            } else {
              console.log('No stale locks to clear.');
            }
          " || true

          if [ -n "$(git status --porcelain .jules/state.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .jules/state.md
            git commit -m "chore: auto-clear stale file locks (>24h)"
            git push origin main || true
          fi

      - name: "Enable auto-merge on eligible agent PRs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${TRIGGER_PR:-}" ]; then
            echo "Triggered by PR #$TRIGGER_PR"
            TARGET_PRS="$TRIGGER_PR"
          else
            echo "Fetching all open PRs..."
            TARGET_PRS=$(gh pr list --state open --json number,title,headRefName,labels --jq '
              .[] | select(
                (.labels[].name? == "auto-merged") or
                (.headRefName | test("^(spec|bolt|sentinel|scribe|refactor)[/-]|^chore/review-")) or
                (.title | test("^(🧪 Spec|⚡ Bolt|🛡️ Sentinel|📝 Scribe|🔧 Refactor|chore\\(review\\)):"))
              ) | .number
            ')
          fi

          if [ -z "$TARGET_PRS" ]; then
            echo "No eligible agent PRs found to process."
            exit 0
          fi

          echo "Candidate PRs to evaluate: $TARGET_PRS"

          for pr in $TARGET_PRS; do
            echo "=============================================="
            echo "Evaluating PR #$pr..."

            # PR metadata + changed files, fetched via API (no checkout of PR code)
            pr_json=$(gh pr view "$pr" --json title,headRefName,labels,isDraft,isCrossRepository,files)
            is_draft=$(echo "$pr_json" | jq -r '.isDraft')
            pr_title=$(echo "$pr_json" | jq -r '.title')
            has_donotmerge=$(echo "$pr_json" | jq -r '.labels | map(.name) | index("do-not-merge") // empty')
            changed_files=$(echo "$pr_json" | jq -r '.files[].path')

            echo "PR #$pr — $pr_title"
            echo "Changed files:"
            echo "$changed_files"

            if [ "$is_draft" = "true" ]; then
              echo "Skipping draft PR #$pr."
              continue
            fi

            if [ -n "$has_donotmerge" ]; then
              echo "Skipping PR #$pr (marked as do-not-merge)."
              continue
            fi

            # ── Inviolable Rules Check (AGENTS.md §4.4 & §4.6) ──────────────
            forbidden_change=false
            forbidden_reason=""

            if echo "$changed_files" | grep -qE '^formal/'; then
              forbidden_change=true
              forbidden_reason="Touches formal Idris 2 proofs (formal/)"
            fi

            if echo "$changed_files" | grep -qE '^src_native/hub/|^src_native/analyzer/|^src_native/wasm_agents/'; then
              forbidden_change=true
              forbidden_reason="Touches native FFI, gRPC Hub, or WASM sandboxes"
            fi

            if echo "$changed_files" | grep -qE 'system_vault\.db|schema\.sql|migrations/'; then
              forbidden_change=true
              forbidden_reason="Touches SQLite database schema"
            fi

            if [ "$forbidden_change" = "true" ]; then
              echo "Inviolable rule violation on PR #$pr: $forbidden_reason"
              gh pr edit "$pr" --add-label "escalation" --add-label "do-not-merge" || true
              gh pr comment "$pr" --body "🚫 Auto-merge blocked by AGENTS.md §4: $forbidden_reason. Escalated to human." || true
              timestamp=$(date -u +'%Y-%m-%d %H:%M')
              echo -e "\n## $timestamp – Escalation\n**Raised by:** Auto-merge Workflow\n**Decision needed:** Inviolable guarantee check on PR #$pr\n**Context:** $forbidden_reason\n**Options:** A) Reject PR B) Manual human approval\n**Recommended:** A\n**Status:** PENDING HUMAN" >> .jules/escalations.md
              continue
            fi

            # ── Delegate validation to ci.yml and arm native auto-merge ─────
            # GitHub merges only once the required status checks on main pass.
            if gh pr merge "$pr" --auto --squash --delete-branch; then
              echo "Auto-merge enabled for PR #$pr (waiting on required checks)."
              gh pr edit "$pr" --add-label "auto-merged" || true
            else
              echo "Could not enable auto-merge for PR #$pr."
              echo "Check that branch protection on 'main' requires the ci.yml status check."
              gh pr edit "$pr" --add-label "escalation" || true
              timestamp=$(date -u +'%Y-%m-%d %H:%M')
              echo -e "\n## $timestamp – Escalation\n**Raised by:** Auto-merge Workflow\n**Decision needed:** Enable auto-merge on PR #$pr\n**Context:** gh pr merge --auto failed. Branch protection on main may not require the ci.yml status check.\n**Options:** A) Configure branch protection B) Merge manually\n**Recommended:** A\n**Status:** PENDING HUMAN" >> .jules/escalations.md
              continue
            fi
          done

          # Persist any escalations written during this run
          if [ -n "$(git status --porcelain .jules/escalations.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .jules/escalations.md
            git commit -m "escalate: auto-merge workflow findings" || true
            git push origin main || true
          fi

name: Auto-merge agent PRs (Scheduled)

on:
  schedule:
    # Runs daily at 07:00 UTC, after the Review agent completes its 06:00 UTC run
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Fetch, test, and merge all auto-merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list --label "auto-merged" --json number,headRefName,headRepositoryOwner --jq '.[] | .number')

          if [ -z "$prs" ]; then
            echo "No open PRs found with label 'auto-merged'."
            exit 0
          fi

          echo "Found PRs to auto-merge: $prs"

          for pr in $prs; do
            echo "Processing PR #$pr..."

            # Checkout PR branch
            gh pr checkout $pr

            # Run test suite
            bun test

            # If tests pass, approve and squash-merge
            gh pr review $pr --approve --body "Auto-merge: tests passed on scheduled run."
            gh pr merge $pr --squash --delete-branch
            echo "PR #$pr merged successfully."
          done

name: Sovereign PSA CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Instalar Dependências NPM/Bun
        run: bun install

      - name: Verificar Binários Nativos
        run: bun run ensure-binaries

      - name: Executar Bateria de Testes (118 Testes Unitários)
        run: bun test

      - name: Executar Diagnóstico 360° Soberano
        run: bun run diagnostic --skip-setup --dry-run

      - name: Compilar e Publicar Interface Desktop Nativa WinUI 3
        run: dotnet publish src_native/winui/PersonasAgentes.WinUI.csproj -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true

      - name: Gerar Pacote de Distribuição
        run: bun run bundle

      - name: Instalar Inno Setup Compiler
        run: choco install innosetup --no-progress -y

      - name: Compilar Instalador Windows via Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\installer\setup.iss

      - name: Publicar Instalador Executável (Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: PersonasAgentes-Setup-v2.0
          path: dist-installer/PersonasAgentes-Setup-v2.0.exe

      - name: Publicar Pacote Extraído de Distribuição
        uses: actions/upload-artifact@v4
        with:
          name: PersonasAgentes-Windows-x64-Folder
          path: dist/

name: Sovereign PSA CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src_native/winui/PersonasAgentes.WinUI.csproj

      - name: Instalar Dependências
        run: bun install

      - name: Compilar e Publicar WinUI 3 (Self-Contained)
        run: dotnet publish src_native/winui/PersonasAgentes.WinUI.csproj -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true

      - name: Gerar Pacote de Distribuição
        run: bun run bundle

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar Instalador (.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\installer\setup.iss

      - name: Publicar Instalador (Setup Executável)
        uses: actions/upload-artifact@v4
        with:
          name: PersonasAgentes-Setup-v2.0
          path: dist-installer/PersonasAgentes-Setup-v2.0.exe

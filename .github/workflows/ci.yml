name: Sovereign PSA CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Instalar Dependências NPM/Bun
        run: bun install

      - name: Verificar Binários Nativos
        run: bun run ensure-binaries

      - name: Executar Bateria de Testes (118 Testes Unitários)
        run: bun test

      - name: Executar Diagnóstico 360° Soberano
        run: bun run diagnostic --skip-setup --dry-run

      - name: Compilar Interface Desktop Nativa WinUI 3
        run: dotnet build src_native/winui/PersonasAgentes.WinUI.csproj -c Release -p:Platform=x64

      - name: Gerar Pacote de Distribuição
        run: bun run bundle

      - name: Publicar Artefato de Distribuição
        uses: actions/upload-artifact@v4
        with:
          name: PersonasAgentes-Windows-x64
          path: dist/

name: Sovereign PSA CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src_native/winui/PersonasAgentes.WinUI.csproj

      # Required so `src_native/hub/hub.exe` can be built instead of being
      # committed. It is a build artifact (`go build -o hub.exe main.go`) and was
      # tracked only because it was committed before `*.exe` reached .gitignore.
      # Must satisfy src_native/hub/go.mod, which declares `go 1.25.0`.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: src_native/hub/go.sum

      - name: Instalar Dependências
        run: bun install

      # Builds any missing native binary. `ensure_binaries.ts` only compiles what is
      # ABSENT, so on a clean checkout this produces the Go Hub and nothing else:
      # `src_native/analyzer/target/release/analyzer.exe` is still committed, so the
      # Rust branch is skipped. If the analyzer is ever untracked too, this step will
      # exit 1 until a Rust toolchain is added here.
      - name: Garantir Binários Nativos
        run: bun run ensure-binaries

      # Fetches the pinned Llama.cpp runtime so the SLM suites run against real
      # artifacts instead of timing out. Until 2026-10-01 these ~48 files had to be
      # placed in bin/ by hand: nothing in the repo produced or downloaded them, and
      # without them a full run degrades from ~32s to ~205s with 13 timeout failures.
      # This is a deliberate third-party dependency, approved by the maintainer under
      # AGENTS.md 4.7. The release tag is pinned and the asset's SHA-256 is verified
      # before extraction (scripts/fetch_llama_runtime.ts).
      - name: Baixar Runtime Llama.cpp (pinado + SHA-256)
        run: bun run fetch-llama

      # Blocks the pipeline on type errors. `bun test` strips types without
      # checking them, so without this gate the repository silently accumulated
      # 63 type errors (including a broken security module) over six weeks.
      - name: Verificar Tipos (tsc --noEmit)
        run: bun run typecheck

      - name: Executar Testes e Gerar Relatório de Coverage
        run: bun run test:coverage

      - name: Gerar Sumário Executivo de Testes no GitHub Actions
        run: bun run test:report

      - name: Compilar e Publicar WinUI 3 (Self-Contained)
        run: dotnet publish src_native/winui/PersonasAgentes.WinUI.csproj -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true

      - name: Gerar Pacote de Distribuição
        run: bun run bundle

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar Instalador (.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\installer\setup.iss

      - name: Publicar Instalador (Setup Executável)
        uses: actions/upload-artifact@v4
        with:
          name: PersonasAgentes-Setup-v2.0
          path: dist-installer/PersonasAgentes-Setup-v2.0.exe

      - name: Criar GitHub Release Oficial (Se for Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/PersonasAgentes-Setup-v2.0.exe
          name: Personas & Agentes (PSA) ${{ github.ref_name }}
          body: |
            # 🏛️ Personas & Agentes (PSA) — Release Oficial ${{ github.ref_name }}

            ### 🚀 O que há de novo:
            - Interface Desktop Nativa WinUI 3 com Fluent Design e streaming em tempo real.
            - Instalação auto-contida (Self-Contained) sem necessidade de dependências pré-instaladas.
            - Suporte a 8 Super Personas e auto-cura verificada formalmente via Idris 2.
          draft: false
          prerelease: false
